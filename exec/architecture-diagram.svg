<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1e3a5f" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#5d7085"/></marker>
    <marker id="eventArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#a45c14"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif; fill:#172b45 }
      .title { font-size:38px; font-weight:800; letter-spacing:-1px }
      .subtitle { font-size:17px; fill:#64748b }
      .zone { fill:#ffffff; stroke:#cbd9e8; stroke-width:2; stroke-dasharray:8 7 }
      .zone-title { font-size:16px; font-weight:800; fill:#52708f; letter-spacing:1px }
      .box { stroke-width:2; filter:url(#shadow) }
      .name { font-size:22px; font-weight:800; text-anchor:middle }
      .detail { font-size:14px; fill:#5f7184; text-anchor:middle }
      .port { font-size:13px; font-weight:700; text-anchor:middle }
      .line { fill:none; stroke:#5d7085; stroke-width:2.5; marker-end:url(#arrow) }
      .dashed { stroke-dasharray:7 6 }
      .event { fill:none; stroke:#b86b16; stroke-width:3; stroke-dasharray:8 6; marker-end:url(#eventArrow) }
      .label { font-size:13px; font-weight:700; fill:#5d7085; text-anchor:middle }
      .event-label { font-size:13px; font-weight:800; fill:#a45c14; text-anchor:middle }
    </style>
